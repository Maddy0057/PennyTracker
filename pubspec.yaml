name: pennytracker
description: "PennyTracker - Personal Expense Tracking Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  
  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Charts
  fl_chart: ^0.70.2
  
  # Navigation
  go_router: ^14.8.1
  
  # Notifications
  flutter_local_notifications: ^18.0.1
  
  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  
  # File & Data
  path_provider: ^2.1.5
  share_plus: ^10.0.0
  file_picker: ^8.1.0
  syncfusion_flutter_pdf: ^28.1.33
  pdf: ^3.11.1

  # Permission
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
